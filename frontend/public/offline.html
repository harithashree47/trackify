<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Trackify — You're offline</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        font-family: "Poppins", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #0f172a;
        padding: 24px;
      }
      .card {
        text-align: center;
        max-width: 360px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #2563eb;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 9999px;
        padding: 6px 14px;
        margin-bottom: 24px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      h1 span {
        background: linear-gradient(90deg, #2563eb, #4f46e5);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #64748b;
        margin-bottom: 28px;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 12px;
        background: #2563eb;
        color: #ffffff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 24px;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:active {
        transform: scale(0.98);
      }
      small {
        display: block;
        margin-top: 18px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge"><span class="dot"></span> Offline</div>
      <h1>No connection to <span>Trackify</span></h1>
      <p>You're offline right now. Reconnect to pick up your goals where you left off.</p>
      <button id="retry">Try again</button>
      <small>Your saved goals will be waiting for you 🎯 </small>
    </div>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.reload();
      });
      window.addEventListener('online', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
